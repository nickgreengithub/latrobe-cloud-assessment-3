name: CI

# Assessment 2 is delivered as a Docker container, not a static site, so the
# GitHub Pages deployment from Assessment 1 has been retired: a static export
# cannot run Route Handlers, which is where the entire API lives. The
# Assessment 1 site remains live from its last successful deployment.
#
# This workflow is the gate on main. Pushing straight to a public branch with
# nothing checking it is how broken code becomes deployed code, so every pull
# request has to lint, type check, build, pass the end-to-end tests and build
# the container image before it can merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./ci.db"

  # End-to-end tests, run against a real production build of the application
  # with a real database — the same way playwright.config.ts starts it locally.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./e2e.db"

      - name: Prepare the database
        run: npx prisma migrate deploy && npm run db:seed
        env:
          DATABASE_URL: "file:./e2e.db"

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: npx playwright test
        env:
          DATABASE_URL: "file:./e2e.db"
          CI: "true"

      # Kept on failure so a red run can be diagnosed from the traces rather
      # than by trying to reproduce it locally.
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the container image
        run: docker build -t latrobe-rss-server:ci .
