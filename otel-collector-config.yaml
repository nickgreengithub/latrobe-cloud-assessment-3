# OpenTelemetry Collector configuration.
#
# The collector exists so the application does not have to know what its
# telemetry backend is. rss-server exports OTLP and nothing else; everything
# below decides where that data ends up.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        # The browser is not an OTLP client here, but the collector refuses
        # cross-origin requests without this and the error it gives is opaque.
        cors:
          allowed_origins:
            - "http://localhost:3000"
            - "http://*"
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Batching is the one processor that is never optional. Without it the
  # collector forwards one export per span and becomes the bottleneck under
  # the JMeter load stages.
  batch:
    timeout: 5s
    send_batch_size: 512

  # A ceiling, so a load test cannot push the collector into consuming all
  # the memory on the host. This stack shares an EC2 instance with the
  # application.
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96

exporters:
  # Jaeger 2.x speaks OTLP natively — the old dedicated Jaeger exporter is
  # gone, and sending OTLP to port 4317 is now the supported path.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # The collector's own view of traffic, in Prometheus format. This is
  # separate from the application's /api/metrics: it measures the telemetry
  # pipeline rather than the application.
  prometheus:
    endpoint: 0.0.0.0:8889

  # Traces on the collector's stdout — `docker compose logs otel-collector`
  # is the fastest way to prove the app is exporting at all.
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: info
